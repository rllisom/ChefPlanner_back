spring.application.name=chef_planner
spring.jpa.open-in-view=false
spring.docker.compose.enabled=false
spring.profiles.active=dev

# JWT
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationThatNeedsToBeAtLeast256BitsLong
jwt.duration=86400

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Storage
storage.location=./uploads


storage.type=s3
storage.s3.endpoint=http://localhost:9000
storage.s3.access-key=minioadmin
storage.s3.secret-key=minioadmin
storage.s3.region=us-east-1
storage.s3.bucket=chefplanner
storage.s3.path-style-access=true

# Error
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always
